project:
  sourceknight: 0.3
  name: SourceChatRelay

  dependencies:
    - name: sourcemod
      type: tar
      version: 1.12
      location: https://sm.alliedmods.net/smdrop/1.12/sourcemod-1.12.0-git7165-linux.tar.gz
      unpack:
        - source: /addons
          dest: /addons

    - name: ext-socket
      type: git
      repo: https://github.com/nefarius/sm-ext-socket
      unpack:
        - source: /
          dest: /addons/sourcemod/scripting/include

    - name: multicolors
      type: git
      repo: https://github.com/Bara/Multi-Colors
      unpack:
        - source: /addons/sourcemod/scripting/include
          dest: /addons/sourcemod/scripting/include

    - name: bytebuffer
      type: git
      repo: https://github.com/rumblefrog/SM-ByteBuffer-Inc
      unpack:
        - source: /
          dest: /addons/sourcemod/scripting/include

  root: /client
  workdir: /
  output: /addons/sourcemod/plugins

  targets:
    - Source-Chat-Relay
