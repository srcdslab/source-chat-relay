name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Client Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup SourcePawn compiler
        uses: rumblefrog/setup-sp@v1.3.1
        with:
          version: "1.12.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          mkdir -p addons/sourcemod/scripting/include deps
          git clone --depth=1 https://github.com/nefarius/sm-ext-socket.git deps/ext-socket
          cp deps/ext-socket/socket.inc addons/sourcemod/scripting/include/
          git clone --depth=1 https://github.com/Bara/Multi-Colors.git deps/multicolors
          cp -R deps/multicolors/addons/sourcemod/scripting/include/* addons/sourcemod/scripting/include/
          git clone --depth=1 https://github.com/rumblefrog/SM-ByteBuffer-Inc.git deps/bytebuffer
          cp deps/bytebuffer/bytebuffer.inc deps/bytebuffer/bytebuffer_es.inc addons/sourcemod/scripting/include/

      - name: Build sourcemod plugin
        working-directory: client
        run: |
          set -euo pipefail
          mkdir -p ../addons/sourcemod/plugins
          spcomp -i include -i ../addons/sourcemod/scripting/include -o ../addons/sourcemod/plugins/Source-Chat-Relay.smx Source-Chat-Relay.sp

      - name: Create package
        run: |
          set -euo pipefail
          mkdir -p /tmp/package/addons/sourcemod/plugins
          cp addons/sourcemod/plugins/*.smx /tmp/package/addons/sourcemod/plugins/

      - name: Upload build archive for test runners
        uses: actions/upload-artifact@v7
        with:
          name: Plugin
          path: /tmp/package

  server:
    name: Build Server
    runs-on: ubuntu-latest

    env:
      GO111MODULE: "on"
      CGO_ENABLED: 0

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set version env
        run: |
          echo "SCRVER=$(git describe --always --long --dirty)" >> "$GITHUB_ENV"

      - name: Install Golang
        uses: actions/setup-go@v4
        with:
          go-version: "1.13.15"

      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: "18.4.0"

      - name: Export bin paths
        run: |
          echo "GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"
          echo "GOBIN=$(go env GOPATH)/bin" >> "$GITHUB_ENV"
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Create bin paths
        run: |
          mkdir -p $GOBIN

      - name: Install PostCSS CLI
        run: npm i -g postcss-cli

      - name: Install Golang Dep
        run: curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh

      - name: Install Packr2
        run: go get github.com/gobuffalo/packr/v2/packr2@v2.6.0

      - name: Install UPX
        run: |
          wget https://github.com/upx/upx/releases/download/v3.95/upx-3.95-amd64_linux.tar.xz
          tar -xf upx-3.95-amd64_linux.tar.xz
          mv upx-3.95-amd64_linux/upx $GITHUB_WORKSPACE/upx

      - name: Process UI
        working-directory: server/ui/template
        run: |
          yarn
          postcss styles.css -o dist/styles.css
          cp index.html dist/index.html

      - name: Install server dependencies
        working-directory: server
        run: go get

      - name: Pack UI files
        working-directory: server
        run: packr2

      - name: Create build folder
        working-directory: server
        run: mkdir build

      - name: Build Linux binary
        working-directory: server
        run: go build -ldflags "-s -w -X github.com/rumblefrog/source-chat-relay/server/config.SCRVER=${{ env.SCRVER }} -extldflags '-static'" -o build/linux-server

      - name: Build ARMv7 binary
        working-directory: server
        run: |
          export GOARCH=arm
          export GOARM=7
          go build -ldflags "-s -w -X github.com/rumblefrog/source-chat-relay/server/config.SCRVER=${{ env.SCRVER }} -extldflags '-static'" -o build/armv7-server

      - name: Build Windows binary
        working-directory: server
        run: |
          export GOOS=windows
          go build -ldflags "-s -w -X github.com/rumblefrog/source-chat-relay/server/config.SCRVER=${{ env.SCRVER }} -extldflags '-static'" -o build/windows-server

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: Server
          path: server/build/

  doc:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: "12.22.12"

      - name: Export npm bin path
        run: export PATH=$PATH:$(npm bin -g)

      - name: Install yarn
        run: npm i -g yarn

      - name: Install dependencies
        working-directory: docs
        run: yarn

      - name: Build documentation
        working-directory: docs
        run: yarn gatsby build --prefix-paths

  tag:
    name: Tag
    needs: [build, server]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Delete existing "latest" release and tag
        run: |
          set -euo pipefail
          gh release delete latest --cleanup-tag --yes || true
          # The tag may exist without a release, so delete it explicitly
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: rickstaa/action-create-tag@v1
        with:
          tag: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs: [build, server, tag]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.server.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Versioning
        run: |
          set -euo pipefail
          version="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Package
        run: |
          set -euo pipefail
          tar -czf "${{ github.event.repository.name }}-${{ env.RELEASE_VERSION }}.tar.gz" Plugin Server

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.tar.gz"
          tag: ${{ env.RELEASE_VERSION }}
          file_glob: true
          overwrite: true
